<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="STACOS — tax and compliance software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1b378c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="translate(96 168)">
    <rect width="88" height="88" rx="20" fill="#1d4ed8"/>
    <text x="44" y="60" text-anchor="middle" fill="#ffffff"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="48" font-weight="800">S</text>
  </g>

  <text x="96" y="330" fill="#ffffff"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="-1.5">STACOS</text>

  <text x="96" y="400" fill="#bfd7fe"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="500">Skorydov Tax and Compliance Software</text>

  <text x="96" y="466" fill="#93bbfd"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400">Every obligation, every due date, in one auditable place.</text>

  <rect x="96" y="516" width="120" height="4" rx="2" fill="#3b76f6"/>
</svg>
