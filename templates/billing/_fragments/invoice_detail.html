{% load i18n %}

<div class="modal show d-block" tabindex="-1" role="dialog" aria-modal="true"
     aria-labelledby="invoice-modal-title">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="invoice-modal-title">
          {% blocktranslate with number=invoice.number %}Invoice {{ number }}{% endblocktranslate %}
        </h2>
        <button type="button" class="btn-close" aria-label="{% translate 'Close' %}"
                @click="$dispatch('stacos:modal-close')"></button>
      </div>
      <div class="modal-body">
        {% include "billing/_fragments/invoice_panel.html" %}
      </div>
    </div>
  </div>
</div>
