{% load i18n crispy_forms_tags %}

<div class="modal show d-block" tabindex="-1" role="dialog" aria-modal="true"
     aria-labelledby="notice-modal-title">
  <div class="modal-dialog modal-lg" role="document">
    <form class="modal-content"
          hx-post="{% url 'notices:create' %}"
          hx-target="#modal-container"
          hx-swap="innerHTML">
      {% csrf_token %}
      <div class="modal-header">
        <h2 class="modal-title h5" id="notice-modal-title">{% translate "Record a notice" %}</h2>
        <button type="button" class="btn-close" aria-label="{% translate 'Close' %}"
                @click="$dispatch('stacos:modal-close')"></button>
      </div>
      <div class="modal-body">
        {% if form.non_field_errors %}
          <div class="alert alert-danger py-2 small" role="alert">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
          </div>
        {% endif %}
        {% crispy form %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary"
                @click="$dispatch('stacos:modal-close')">{% translate "Cancel" %}</button>
        <button type="submit" class="btn btn-primary">{% translate "Record" %}</button>
      </div>
    </form>
  </div>
</div>
