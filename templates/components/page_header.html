{#  Usage:  <c-page-header title="Entities" subtitle="…"><a class="btn btn-primary">New</a></c-page-header>  #}
<header class="page-header">
  <div>
    <h1 class="page-header__title">{{ title }}</h1>
    {% if subtitle %}<p class="page-header__subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if slot %}<div class="d-flex align-items-center gap-2">{{ slot }}</div>{% endif %}
</header>
