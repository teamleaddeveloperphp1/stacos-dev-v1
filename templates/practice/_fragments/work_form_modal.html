{% load i18n crispy_forms_tags %}

<div class="modal show d-block" tabindex="-1" role="dialog" aria-modal="true"
     aria-labelledby="work-modal-title">
  <div class="modal-dialog" role="document">
    <form class="modal-content"
          hx-post="{% url 'practice:work_create' %}"
          hx-target="#modal-container"
          hx-swap="innerHTML">
      {% csrf_token %}
      <div class="modal-header">
        <h2 class="modal-title h5" id="work-modal-title">{% translate "New work item" %}</h2>
        <button type="button" class="btn-close" aria-label="{% translate 'Close' %}"
                @click="$dispatch('stacos:modal-close')"></button>
      </div>
      <div class="modal-body">
        {% crispy form %}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary"
                @click="$dispatch('stacos:modal-close')">{% translate "Cancel" %}</button>
        <button type="submit" class="btn btn-primary">{% translate "Create" %}</button>
      </div>
    </form>
  </div>
</div>
