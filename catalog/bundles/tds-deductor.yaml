code: IN-PACK-TDS-DEDUCTOR
country: IN
name: TDS and TCS deductor
summary: Monthly payments, quarterly returns, the certificates that follow them, and the reconciliation
  that catches a default before it becomes a demand.
rationale: Add this if you hold a TAN. The quarterly returns are the visible part; the reconciliation
  is what stops a mismatch turning into a Section 201 demand.
