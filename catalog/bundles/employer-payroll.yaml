code: IN-PACK-EMPLOYER-PAYROLL
country: IN
name: Employer — PF and ESIC
summary: Monthly contributions and returns for provident fund and employees' state insurance, plus the
  member-level steps that follow a joiner or a leaver.
rationale: Add this as soon as you have employees on a payroll. The monthly filings are the obvious part;
  the per-employee enrolment steps are the ones that get missed.
tags:
- epf
- esic
- payroll
suggest_for:
  any:
  - fact: registrations
    op: includes
    value: PF
    explain: you hold an EPFO establishment code
  - fact: registrations
    op: includes
    value: ESIC
    explain: you hold an ESIC employer code
definitions:
- IN-EPF-CONTRIBUTION-PAYMENT
- IN-EPF-ECR-RECON
- IN-EPF-EMPLOYEE-ENROLMENT
- IN-EPF-EMPLOYEE-EXIT
- IN-EPF-EMPLOYEE-KYC
- IN-EPF-EMPLOYER-PROFILE-CORRECTION
- IN-EPF-FORM11
- IN-EPF-FORM5A
- IN-EPF-UAN-GENERATION
- IN-EPF-UAN-PROFILE-CORRECTION
- IN-ESIC-CONTRIBUTION-PAYMENT
