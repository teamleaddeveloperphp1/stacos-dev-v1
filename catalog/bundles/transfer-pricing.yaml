code: IN-PACK-TRANSFER-PRICING
country: IN
name: International group — transfer pricing
summary: Contemporaneous documentation, the accountant's report, and the master file and country-by-country
  chain where the group is large enough.
rationale: Add this if you transact with related parties abroad. The documentation has to be contemporaneous,
  so it cannot be caught up once an assessment arrives.
tags:
- income-tax
- transfer-pricing
suggest_for:
  all:
  - fact: has_foreign_shareholding
    op: eq
    value: true
    explain: you are part of an international group
