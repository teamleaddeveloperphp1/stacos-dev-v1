code: IN-PACK-DIRECTOR-CHANGES
country: IN
name: Director and KMP changes
summary: The filings that follow an appointment, a resignation or a change of office — each one triggered
  by the event rather than by the calendar.
rationale: Add this if your board ever changes. Nothing appears until you record an appointment or a resignation,
  and then the right forms appear with the right deadlines.
