# `name` is spelled exactly as the Add/Edit Entity screen labels it
# (`ENTITY_TYPE_LABELS` in stacos/tenancy/forms.py) — a test holds the two
# together, so one legal form is never written two ways in the product.
# `description` is what the legal form *is*, not what it owes: the Learn page
# shows it before any entity exists, beside a count of what the catalog carries.
entity_types:
  - code: PVT_LTD
    name: Private Limited Company
    description: >-
      A company limited by shares, privately held. The most common structure for
      a growing Indian business, and the one carrying the full Companies Act
      governance and filing regime.
  - code: PUBLIC_LTD
    name: Public Limited Company
    description: >-
      A company limited by shares that may offer them to the public. The same
      Companies Act regime as a private company, with extra disclosure and, if
      listed, securities-law obligations on top.
  - code: OPC
    name: One Person Company
    description: >-
      A company with a single shareholder, who is usually also its sole director.
      Companies Act obligations apply, with a few relaxations sized for one
      person.
  - code: LLP
    name: Limited Liability Partnership
    description: >-
      A partnership where each partner's liability is limited to their
      contribution. Registered with the Ministry of Corporate Affairs, but outside
      the Companies Act — its filings follow the LLP Act instead.
  - code: PARTNERSHIP
    name: Partnership Firm
    description: >-
      Two or more people carrying on business together under the Indian
      Partnership Act, with unlimited personal liability. A lighter filing load
      than a company, but no legal identity separate from its partners.
  - code: PROPRIETORSHIP
    name: Sole Proprietorship
    description: >-
      A business with no legal identity apart from its owner. What looks like
      'compliance' here is almost entirely the owner's own tax filings and
      registrations.
  - code: TRUST
    name: Trust
    description: >-
      A person or institution holding property for a defined purpose or set of
      beneficiaries. Obligations follow whether it is registered under the Indian
      Trusts Act, a state Public Trusts Act, or claims income-tax exemption.
  - code: SOCIETY
    name: Society
    description: >-
      A group of people registered under the Societies Registration Act for a
      literary, scientific or charitable purpose. Governed by its own bye-laws
      rather than the Companies Act.
  - code: SECTION_8
    name: Section 8 Company
    description: >-
      A company formed for a charitable or non-profit purpose. Carries the
      Companies Act's filing regime, plus the checks that come with claiming tax
      exemption.
  - code: BRANCH_OFFICE
    name: Branch Office of a foreign company
    description: >-
      An Indian presence of a company incorporated abroad, permitted a defined set
      of activities under FEMA. Filings run through the RBI and the Registrar of
      Companies rather than a fresh incorporation.
  - code: LIAISON_OFFICE
    name: Liaison Office
    description: >-
      A foreign company's representative presence in India, permitted to liaise
      but not to trade or invoice locally. The lightest of the foreign-entry
      structures, with correspondingly narrow filings.
  - code: COOPERATIVE
    name: Co-operative Society
    description: >-
      A society registered under a state Co-operative Societies Act, owned and run
      by its members. Filings and audit run through the Registrar of Co-operative
      Societies rather than the MCA.
  - code: HUF
    name: Hindu Undivided Family
    description: >-
      A Hindu Undivided Family, recognised as its own taxpayer under Indian
      income-tax law and run by its karta. Its obligations sit almost entirely on
      the tax side, not among corporate filings.
  - code: GOVERNMENT
    name: Government
    description: >-
      A government department, public-sector undertaking or statutory body. What
      applies here is whichever variant of the standard regime a specific
      notification extends to that body.

# `catalog` is the flat identifier vocabulary (unchanged in spirit from before);
# `by_entity_type` is the Add/Edit Entity screen's mapping of "which identifiers
# does this entity type see, in what order, at what requirement level" — M
# (mandatory), C (conditional), "M/C" (mandatory-or-conditional, preserved
# verbatim because the exact trigger rule is not decided yet), or unmarked
# (present, optional). A code with no entry for a given entity type does not
# apply to it at all. Order here is the order fields render in, except CIN,
# which the Add/Edit Entity screen always pins first (PAN immediately after)
# regardless of where it sits in this list — that override is UI layout policy
# implemented in `stacos.jurisdictions.registration_requirements`, not a fact
# about India, so it lives in code rather than being repeated in every row here.
registration_types:
  catalog:
    - { code: PAN, name: Permanent Account Number }
    - { code: TAN, name: Tax Deduction Account Number }
    - { code: GST, name: GST identification number, per_jurisdiction: true }
    - { code: CIN, name: Corporate Identity Number }
    - { code: LLPIN, name: LLP Identification Number }
    - { code: PF, name: EPFO establishment code }
    - { code: ESIC, name: ESIC employer code }
    - { code: PT_EC, name: Professional tax — enrolment certificate, per_jurisdiction: true }
    - { code: PT_RC, name: Professional tax — registration certificate, per_jurisdiction: true }
    - { code: IEC, name: Importer Exporter Code }
    - { code: UDYAM, name: Udyam registration }
    - { code: FACTORY_LICENCE, name: Factory licence, per_jurisdiction: true }
    - { code: SHOPS_ESTAB, name: Shops and establishments registration, per_jurisdiction: true }
    - { code: PCB_CONSENT, name: Pollution control board consent, per_jurisdiction: true }
    - { code: DRUG_LICENCE, name: Drug licence, per_jurisdiction: true }
    - { code: FSSAI, name: FSSAI licence }
    - { code: LEGAL_METROLOGY, name: Legal metrology registration, per_jurisdiction: true }
    - { code: BIS, name: BIS certification }
    - { code: TRADE_LICENCE, name: Municipal trade licence, per_jurisdiction: true }
    - { code: FIRE_NOC, name: Fire safety no-objection certificate, per_jurisdiction: true }
    - { code: CONTRACT_LABOUR, name: Contract labour registration, per_jurisdiction: true }
    - { code: FCRN, name: Foreign Company Registration Number }
    - { code: FIRM_REGN, name: Registrar of Firms registration number }
    - { code: TRUST_REGN, name: Trust registration number }
    - { code: SOCIETY_REGN, name: Society registration number }
    - { code: COOP_REGN, name: Co-operative society registration number }
    - { code: RBI_ROC_DETAILS, name: RBI/ROC details }
    - { code: RBI_APPROVAL, name: RBI approval reference }
    - { code: KARTA_PAN, name: Karta's PAN }
    - { code: "12AB", name: Income-tax registration under section 12AB }
    - { code: "80G", name: Income-tax approval under section 80G }
    - { code: DARPAN, name: NGO Darpan ID }
  by_entity_type:
    PVT_LTD: [{ code: PAN, requirement: M }, TAN, GST, { code: CIN, requirement: C }, ESIC, PF, IEC, UDYAM]
    PUBLIC_LTD: [{ code: PAN, requirement: M }, TAN, GST, { code: CIN, requirement: M }, ESIC, PF, IEC, UDYAM]
    OPC: [{ code: PAN, requirement: M }, TAN, GST, { code: CIN, requirement: M }, ESIC, PF, IEC, UDYAM]
    LLP: [{ code: PAN, requirement: M }, TAN, GST, { code: LLPIN, requirement: M }, ESIC, PF, IEC, UDYAM]
    PARTNERSHIP: [{ code: PAN, requirement: M }, TAN, GST, { code: FIRM_REGN, requirement: C }, ESIC, PF, IEC, UDYAM]
    PROPRIETORSHIP: [{ code: PAN, requirement: M }, TAN, GST, ESIC, PF, UDYAM, IEC]
    TRUST: [{ code: PAN, requirement: M }, TAN, GST, { code: TRUST_REGN, requirement: M }, ESIC, PF, "12AB", "80G", DARPAN]
    SOCIETY: [{ code: PAN, requirement: M }, TAN, GST, { code: SOCIETY_REGN, requirement: "M/C" }, ESIC, PF, "12AB", "80G", DARPAN]
    SECTION_8: [{ code: PAN, requirement: M }, TAN, GST, { code: CIN, requirement: M }, ESIC, PF, "12AB", "80G", DARPAN, IEC]
    BRANCH_OFFICE: [{ code: PAN, requirement: M }, TAN, GST, { code: FCRN, requirement: M }, ESIC, PF, RBI_ROC_DETAILS, IEC]
    LIAISON_OFFICE: [{ code: PAN, requirement: M }, TAN, GST, { code: FCRN, requirement: M }, ESIC, PF, RBI_APPROVAL]
    COOPERATIVE: [{ code: PAN, requirement: M }, TAN, GST, { code: COOP_REGN, requirement: M }, ESIC, PF, UDYAM, IEC]
    HUF: [{ code: PAN, requirement: M }, TAN, GST, ESIC, PF, { code: KARTA_PAN, requirement: M }]
    GOVERNMENT: [{ code: PAN, requirement: M }, TAN, GST, { code: CIN, requirement: C }, ESIC, PF, IEC, UDYAM]

# Sunday only. Note what this is *not*: a statement that Indian due dates move
# off a Sunday. They do not — the portals accept filings on a Sunday and relief
# comes through explicit notifications. This drives the small number of
# physically-dependent obligations that genuinely need a working day.
weekend_rules:
  - weekend_days: [6]
    valid_from: 1947-08-15
    note: Sunday only. Saturday is a working day for most statutory purposes.

