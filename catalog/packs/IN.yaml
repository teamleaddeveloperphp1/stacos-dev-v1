# India — jurisdiction pack.
#
# Everything that varies by country, held as data. The financial year starting in
# April, the Sunday weekend, the lakh/crore grouping, the entity types and the tax
# identifiers all live here, so shipping the UAE means adding a file rather than
# editing code.
#
# Weekend rules are effective-dated deliberately. India has not moved its weekend,
# which is exactly why hardcoding it would go unnoticed until the UAE — which
# moved the public-sector weekend to Saturday–Sunday in January 2022 — was added.

country: IN
name: India
currency: INR
currency_symbol: "₹"
default_timezone: Asia/Kolkata
default_locale: en-in
digit_grouping: INDIAN

# 1 April – 31 March. Never assumed anywhere in the engine.
fy_start_month: 4
fy_start_day: 1
fy_label_template: "FY{start_year}-{end_year_short}"

is_published: true

