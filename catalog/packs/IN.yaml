# National holidays only. State calendars are substantial and are loaded
# separately; the three gazetted national holidays are the ones every calendar
# needs. Note again that these do NOT shift statutory tax dates — they exist for
# the handful of obligations that require somebody to physically attend an office.
holiday_calendars:
  - key: IN-NATIONAL
    name: India — national holidays
    holidays:
      - { date: 2026-01-26, name: Republic Day }
      - { date: 2026-08-15, name: Independence Day }
      - { date: 2026-10-02, name: Gandhi Jayanti }
      - { date: 2027-01-26, name: Republic Day }
      - { date: 2027-08-15, name: Independence Day }
      - { date: 2027-10-02, name: Gandhi Jayanti }
      - { date: 2028-01-26, name: Republic Day }
      - { date: 2028-08-15, name: Independence Day }
      - { date: 2028-10-02, name: Gandhi Jayanti }
