code: IN-SAFETY-LIFT-INSPECTION
country: IN
category: SAFETY_FIRE
family: Plant safety
authority: STATE_LABOUR
version: 1
title: Lift and escalator — annual licence renewal
plain_language_summary: >
  Passenger lifts need an annual licence from the state electrical inspectorate,
  granted after inspection. Building managers usually hold the paperwork, so a
  tenant company frequently discovers the lapse only when the lift is sealed.
statutory_reference: State Lifts and Escalators Acts
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: has_lift
      op: eq
      value: true
      explain: you operate a lift or escalator
due:
  anchor: FY_START
  offset: { months: 3, day_of_month: 30 }
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: licence, label: Renewed lift licence, kind: DOC, mandatory_for_close: true }
default_owner_role: org-plant
penalty_summary: "Fines vary by state; the lift may be sealed pending renewal."
effective_from: 2015-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
