code: IN-LABOUR-CANTEEN-COMPLIANCE
country: IN
category: LABOUR
family: Factories
authority: STATE_LABOUR
version: 1
title: Factory canteen — annual compliance and licence review
plain_language_summary: >
  A factory employing 250 or more workers must run a canteen, and the canteen needs
  its own FSSAI registration. Two separate regulators for one room, which is why
  it is worth a calendar entry of its own.
statutory_reference: Section 46 Factories Act, 1948 r/w state rules
periodicity: ANNUAL
period_anchor: FY
instance_scope: PREMISES
scope_selector:
  premises_type: FACTORY
applicability:
  all:
    - fact: has_canteen
      op: eq
      value: true
      explain: you operate a canteen
due:
  anchor: FY_START
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: fssai, label: Canteen FSSAI registration, kind: DOC, mandatory_for_close: true }
  - { key: managing_committee, label: Canteen managing committee minutes, kind: DOC }
default_owner_role: org-plant
penalty_summary: "Up to ₹1,00,000 under Section 92, plus FSSAI penalties separately."
effective_from: 1948-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
