code: IN-LABOUR-OCCUPATIONAL-HEALTH
country: IN
category: SAFETY_FIRE
family: Factories
authority: STATE_LABOUR
version: 1
title: Occupational health check-up for workers in hazardous processes
plain_language_summary: >
  Workers engaged in hazardous processes must be medically examined at prescribed
  intervals — commonly every six months — by a certifying surgeon, with the results
  recorded in the health register. The register follows the worker, so gaps show up
  years later.
statutory_reference: Section 41C Factories Act, 1948 r/w state rules
periodicity: HALF_YEARLY
period_anchor: FY
instance_scope: PREMISES
scope_selector:
  premises_type: FACTORY
applicability:
  all:
    - fact: registrations
      op: includes
      value: FACTORY_LICENCE
      explain: you hold a factory licence
    - fact: deals_in_hazardous_material
      op: eq
      value: true
      explain: you carry on a hazardous process
due:
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: -1 }
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: health_register, label: Health register entries, kind: DOC, mandatory_for_close: true }
  - { key: surgeon_report, label: Certifying surgeon's report, kind: DOC }
default_owner_role: org-plant
penalty_summary: "Up to ₹2,00,000 and imprisonment up to two years for hazardous-process breaches."
effective_from: 1987-12-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
