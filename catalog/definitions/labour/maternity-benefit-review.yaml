code: IN-LABOUR-MATERNITY-CRECHE
country: IN
category: LABOUR
family: Wages
authority: STATE_LABOUR
version: 1
title: Maternity benefit and crèche facility — annual compliance review
plain_language_summary: >
  Establishments with fifty or more employees must provide a crèche and allow four
  visits a day to it. The maternity benefit itself is twenty-six weeks paid leave.
  Both are absolute obligations rather than policy choices.
statutory_reference: Sections 5 and 11A Maternity Benefit Act, 1961
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: employee_count
      op: gte
      value: 50
      explain: you employ fifty or more people, which brings the crèche requirement into force
    - fact: women_employees_count
      op: gte
      value: 1
      explain: you employ women
due:
  anchor: FY_START
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: policy, label: Maternity benefit policy and notice displayed, kind: DOC, mandatory_for_close: true }
  - { key: creche, label: Crèche arrangement evidence, kind: DOC }
default_owner_role: org-hr
penalty_summary: "Imprisonment up to one year and a fine up to ₹5,000."
effective_from: 2017-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
