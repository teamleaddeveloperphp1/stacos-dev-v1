code: IN-LABOUR-POSH-COMMITTEE
country: IN
category: LABOUR
family: POSH
authority: STATE_LABOUR
version: 1
title: POSH internal committee — annual reconstitution and training
plain_language_summary: >
  The internal committee needs a presiding officer who is a senior woman employee,
  an external member from an NGO, and a three-year term. Members leave, and a
  committee that no longer meets the composition rules is treated as no committee
  at all.
statutory_reference: Sections 4 and 19 Sexual Harassment of Women at Workplace Act, 2013
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: employee_count
      op: gte
      value: 10
      explain: you employ ten or more people
    - fact: women_employees_count
      op: gte
      value: 1
      explain: you employ women, so a presiding officer can be appointed from within
due:
  anchor: FY_START
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: order, label: Committee constitution order, kind: DOC, mandatory_for_close: true }
  - { key: training, label: Awareness training record, kind: DOC }
default_owner_role: org-hr
penalty_summary: "Up to ₹50,000 for failing to constitute a committee."
effective_from: 2013-12-09
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
