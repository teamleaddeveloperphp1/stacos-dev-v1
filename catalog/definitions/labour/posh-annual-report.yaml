code: IN-LABOUR-POSH-ANNUAL
country: IN
category: LABOUR
family: POSH
authority: STATE_LABOUR
version: 1
title: POSH annual report to the district officer
plain_language_summary: >
  Every workplace with ten or more employees must have an internal committee under
  the sexual harassment law and file an annual report of complaints received and
  resolved. The report is due even when there were no complaints — a nil report is
  still a report.
statutory_reference: Section 21 Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013
periodicity: ANNUAL
period_anchor: CALENDAR
instance_scope: ENTITY
applicability:
  all:
    - fact: employee_count
      op: gte
      value: 10
      explain: you employ ten or more people
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 31 }
  shift_if_holiday: NEXT_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: report, label: Filed annual report, kind: DOC, mandatory_for_close: true }
  - { key: committee, label: Internal committee constitution order, kind: DOC }
default_owner_role: org-hr
penalty_summary: "Up to ₹50,000; repeat default can mean cancellation of the business licence."
effective_from: 2013-12-09
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
