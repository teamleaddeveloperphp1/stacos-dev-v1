code: IN-LABOUR-SAFETY-COMMITTEE
country: IN
category: SAFETY_FIRE
family: Factories
authority: STATE_LABOUR
version: 1
title: Safety committee meeting
plain_language_summary: >
  Factories carrying on hazardous processes must have a safety committee with equal
  worker and management representation, meeting at least quarterly. The minutes are
  the first document an inspector asks for after an accident.
statutory_reference: Section 41G Factories Act, 1948
periodicity: QUARTERLY
period_anchor: FY
instance_scope: PREMISES
scope_selector:
  premises_type: FACTORY
applicability:
  all:
    - fact: registrations
      op: includes
      value: FACTORY_LICENCE
      explain: you hold a factory licence
    - fact: employee_count
      op: gte
      value: 100
      explain: you employ a hundred or more people at the site
due:
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: -1 }
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: minutes, label: Signed minutes, kind: DOC, mandatory_for_close: true }
  - { key: attendance, label: Attendance record, kind: DOC }
default_owner_role: org-plant
penalty_summary: "Up to ₹1,00,000 under Section 92, with higher penalties after an accident."
effective_from: 1987-12-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
