code: IN-LABOUR-EMPLOYEE-REGISTERS
country: IN
category: LABOUR
family: Wages
authority: STATE_LABOUR
version: 1
title: Statutory labour registers — annual audit
plain_language_summary: >
  Registers of employment, wages, overtime, leave and fines have to be maintained
  in the prescribed forms and produced on inspection. The consolidated forms under
  the Ease of Compliance Rules replaced nine registers with five, but the
  obligation to keep them did not go away.
statutory_reference: Ease of Compliance to Maintain Registers under Various Labour Laws Rules, 2017
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: employee_count
      op: gte
      value: 10
      explain: you employ ten or more people
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: registers, label: Registers A to E, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Fines under each parent enactment, typically ₹10,000–₹1,00,000."
effective_from: 2017-02-21
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
