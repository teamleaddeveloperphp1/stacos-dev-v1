code: IN-IT-ADVANCE-TAX-Q4
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Advance tax — fourth instalment (100%)
plain_language_summary: >
  The whole of the year's estimated tax by 15 March. Anything still unpaid after
  31 March attracts interest under Section 234B as well as 234C, which is why the
  March instalment is the one worth over-estimating slightly.
statutory_reference: Section 211 Income-tax Act
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: PAN
      explain: you hold a PAN
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, OPC, LLP, PARTNERSHIP, SECTION_8, TRUST, BRANCH_OFFICE]
      explain: you are a company, LLP, firm or other non-individual assessee
    - fact: is_dormant
      op: ne
      value: true
      explain: you are not a dormant company
due:
  anchor: FY_START
  offset: { months: 11, day_of_month: 15 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Challan ITNS-280, kind: DOC, mandatory_for_close: true }
  - { key: computation, label: Final estimated income computation, kind: DOC }
default_owner_role: org-finance
penalty_summary: "Interest at 1% per month under Sections 234B and 234C on the shortfall."
effective_from: 2017-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
