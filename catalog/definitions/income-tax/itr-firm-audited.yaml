code: IN-IT-ITR-FIRM-AUDITED
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Income tax return — LLP or firm subject to audit (ITR-5)
plain_language_summary: >
  The annual return for an LLP or partnership whose accounts are audited, due
  31 October. The audit threshold — ₹1 crore of turnover, or ₹10 crore where cash
  receipts and payments are both under 5% — is what puts a firm on this date rather
  than 31 July.
statutory_reference: Section 139(1) Income-tax Act
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: PAN
      explain: you hold a PAN
    - fact: entity_type
      op: in
      value: [LLP, PARTNERSHIP]
      explain: you are an LLP or partnership firm
    - fact: aggregate_turnover
      op: gt
      value: 10000000
      explain: your turnover is above the ₹1 crore tax-audit threshold
due:
  anchor: PERIOD_END
  offset: { months: 7, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: ITR-V acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: computation, label: Computation of total income, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹5,000 under Section 234F, interest under 234A, loss carry-forward forfeited."
effective_from: 2021-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
