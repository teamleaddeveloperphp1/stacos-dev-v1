code: IN-IT-TAX-AUDIT-3CB
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Tax audit report — Form 3CB
plain_language_summary: Form 3CB is used where nothing else already requires an audit — a firm or proprietorship
  over the threshold. Paired with 3CD, never filed alone.
statutory_reference: Section 44AB Income-tax Act r/w Rule 6G
filing_portal_url: https://www.incometax.gov.in
tags:
- income-tax
- audit-report
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - LLP
    - PARTNERSHIP
    - PROPRIETORSHIP
    - HUF
    explain: your accounts are not audited under any other law
  - fact: aggregate_turnover
    op: gte
    value: 10000000
    explain: your turnover is above the tax audit threshold
due:
  anchor: PERIOD_END
  offset:
    months: 6
    day_of_month: 30
  shift_if_holiday: NONE
evidence:
- key: 3cb
  label: Form 3CB
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-finance
penalty_summary: 0.5% of turnover, capped at ₹1,50,000, under Section 271B.
