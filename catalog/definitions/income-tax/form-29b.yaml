code: IN-IT-FORM29B
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Form 29B — minimum alternate tax certificate
plain_language_summary: >
  An accountant's certificate of book profit under the minimum alternate tax
  provisions, required from every company and filed with the audit report. It is
  what supports the MAT credit a company will claim in later years.
statutory_reference: Section 115JB(4) Income-tax Act r/w Rule 40B
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, OPC]
      explain: you are a company, and MAT applies to companies
    - fact: is_dormant
      op: ne
      value: true
      explain: you are not dormant
due:
  anchor: PERIOD_END
  offset: { months: 6, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: certificate, label: Signed Form 29B, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "The return may be treated as defective under Section 139(9)."
effective_from: 2021-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
