title: Tax audit report — Form 3CA
plain_language_summary: Form 3CA is the audit report used where the accounts are already audited under
  another law — a company, for instance. 3CB is the alternative, and using the wrong one is a defect in
  the report.
statutory_reference: Section 44AB Income-tax Act r/w Rule 6G
filing_portal_url: https://www.incometax.gov.in
