    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - OPC
    - SECTION_8
    explain: you are a company
  - fact: aggregate_turnover
    op: gte
    value: 10000000
    explain: your turnover is above the tax audit threshold
