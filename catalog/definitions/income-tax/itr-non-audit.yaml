code: IN-IT-ITR-NON-AUDIT
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Income tax return — assessee not subject to audit
plain_language_summary: >
  The annual return for a proprietorship, HUF, firm or LLP below the audit
  threshold, due 31 July. Three months earlier than the audited date, and the
  deadline most often missed by small businesses who assume October applies to
  everyone.
statutory_reference: Section 139(1) Income-tax Act
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: PAN
      explain: you hold a PAN
    - fact: entity_type
      op: in
      value: [PROPRIETORSHIP, HUF, PARTNERSHIP, LLP]
      explain: you are an individual, HUF, firm or LLP
    - fact: aggregate_turnover
      op: lte
      value: 10000000
      explain: your turnover is at or below the ₹1 crore tax-audit threshold
due:
  anchor: PERIOD_END
  offset: { months: 4, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: ITR-V acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: computation, label: Computation of total income, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹1,000–₹5,000 under Section 234F depending on total income, plus interest under 234A."
effective_from: 2021-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
