code: IN-IT-FORM61A-SFT
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Form 61A — statement of financial transactions
plain_language_summary: >
  A report of specified high-value transactions — large cash receipts, share
  issues, purchases above the notified thresholds — due 31 May. It feeds the
  department's data-matching, which is how the pre-filled return and the
  mismatch notices are both generated.
statutory_reference: Section 285BA Income-tax Act r/w Rule 114E
filing_portal_url: "https://report.insight.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: PAN
      explain: you hold a PAN
    - fact: aggregate_turnover
      op: gt
      value: 10000000
      explain: your turnover is above the tax-audit threshold, which brings SFT reporting into scope
due:
  anchor: PERIOD_END
  offset: { months: 2, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed statement acknowledgement, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹500 per day of default, rising to ₹1,000 per day after a notice, under Section 271FA."
effective_from: 2017-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
