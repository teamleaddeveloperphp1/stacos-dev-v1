code: IN-IT-FORM3CEB
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Form 3CEB — transfer pricing report
plain_language_summary: >
  An accountant's report on international and specified domestic transactions with
  associated enterprises, due 31 October. The penalty for not filing is ₹1,00,000
  flat, and separate penalties apply to the transactions themselves being
  mispriced.
statutory_reference: Section 92E Income-tax Act r/w Rule 10E
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: PAN
      explain: you hold a PAN
    - any:
        - fact: has_foreign_shareholding
          op: eq
          value: true
          explain: you have foreign shareholders, so cross-border transactions are likely
        - fact: has_related_party_txns
          op: eq
          value: true
          explain: you have related-party transactions
due:
  anchor: PERIOD_END
  offset: { months: 7, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: report, label: Signed Form 3CEB, kind: DOC, mandatory_for_close: true }
  - { key: tp_study, label: Transfer pricing study, kind: DOC }
default_owner_role: org-finance
penalty_summary: "₹1,00,000 under Section 271BA for non-filing, plus 2% of transaction value under 271AA."
effective_from: 2021-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
