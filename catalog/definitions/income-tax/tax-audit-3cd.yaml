code: IN-IT-TAX-AUDIT-3CD
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Tax audit report — Form 3CA/3CB and 3CD
plain_language_summary: >
  The auditor's report that has to be filed a month before the return itself, on
  30 September. The return cannot be filed on the audited timeline until this is
  uploaded and accepted by the assessee, so a late audit report cascades straight
  into a late return.
statutory_reference: Section 44AB Income-tax Act r/w Rule 6G
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  any:
    - all:
        - fact: entity_type
          op: in
          value: [PVT_LTD, PUBLIC_LTD, OPC]
          explain: you are a company
        - fact: is_dormant
          op: ne
          value: true
          explain: you are not dormant
    - fact: aggregate_turnover
      op: gt
      value: 10000000
      explain: your turnover is above the ₹1 crore tax-audit threshold
due:
  anchor: PERIOD_END
  offset: { months: 6, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: report, label: Signed Form 3CD with annexures, kind: DOC, mandatory_for_close: true }
  - { key: acceptance, label: Assessee acceptance on the portal, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "0.5% of turnover, capped at ₹1,50,000, under Section 271B."
effective_from: 2021-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
