title: Form 10B/10BB — audit report for a charitable institution
plain_language_summary: >
  The audit report a trust, society or Section 8 company must file to keep its
  exemption, due 30 September. Filing late does not attract a fee — it costs the
  exemption for the year, which is a far larger number.
statutory_reference: Section 12A(1)(b) Income-tax Act r/w Rule 17B
filing_portal_url: "https://www.incometax.gov.in"
periodicity: ANNUAL
