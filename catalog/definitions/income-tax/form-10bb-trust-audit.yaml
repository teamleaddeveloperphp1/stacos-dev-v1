  - { key: report, label: Signed audit report, kind: DOC, mandatory_for_close: true }
  - { key: accounts, label: Audited accounts, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "Exemption under Sections 11 and 12 is denied for the year."
