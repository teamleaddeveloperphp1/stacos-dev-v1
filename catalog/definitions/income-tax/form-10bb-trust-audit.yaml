    - fact: entity_type
      op: in
      value: [TRUST, SOCIETY, SECTION_8]
      explain: you are a charitable trust, society or Section 8 company
due:
  anchor: PERIOD_END
  offset: { months: 6, day_of_month: 30 }
  shift_if_holiday: NONE
