code: IN-IT-FORM3CEAB
country: IN
category: TAX_DIRECT
family: Income tax
authority: CBDT
version: 1
title: Master File — designated constituent entity intimation
plain_language_summary: Where several Indian entities of one group exist, they nominate one to file the
  master file. This is the intimation of that choice, and it is due before the master file itself.
statutory_reference: Rule 10DA Income-tax Rules
filing_portal_url: https://www.incometax.gov.in
tags:
- income-tax
- transfer-pricing
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
  - fact: has_foreign_shareholding
    op: eq
    value: true
    explain: you are part of an international group
  - fact: aggregate_turnover
    op: gte
    value: 5000000000
    explain: your turnover is at or above the master-file threshold
due:
  anchor: PERIOD_END
  offset:
    months: 10
    day_of_month: 31
  shift_if_holiday: NONE
evidence:
- key: 3ceab
  label: Form 3CEAB
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-finance
penalty_summary: Non-compliance can attract penalties applicable to Master File reporting.
effective_from: '2017-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
