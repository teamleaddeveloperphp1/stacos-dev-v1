title: Transfer-pricing documentation — contemporaneous records
plain_language_summary: Transfer-pricing documentation has to be *contemporaneous* — assembled by the
  report due date, not reconstructed when the assessment arrives. The penalty is for not having kept it,
  and it cannot be cured later.
statutory_reference: Section 92D Income-tax Act r/w Rule 10D Income-tax Rules
