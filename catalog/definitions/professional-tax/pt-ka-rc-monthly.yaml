code: IN-PT-KA-RC-MONTHLY
country: IN
category: LABOUR
family: Professional tax
authority: STATE_TAX
version: 1
title: Professional tax — Karnataka employer return (monthly)
plain_language_summary: >
  Karnataka's monthly employer return and payment, due by the 20th. The threshold
  salary and the flat ₹200 per month per employee have both changed in recent
  years, so working papers from two years ago should not be reused.
statutory_reference: Section 6A Karnataka Tax on Professions, Trades, Callings and Employments Act, 1976
periodicity: MONTHLY
jurisdictions: [IN-KA]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
applicability:
  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees whose salary attracts professional tax
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 20 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Interest at 1.25% per month plus penalty up to 50% of the tax."
effective_from: 1976-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
