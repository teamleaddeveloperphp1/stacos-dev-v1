  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees whose salary attracts professional tax
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: -1 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment receipt, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Penalty as prescribed by the local body, typically 2% per month."
