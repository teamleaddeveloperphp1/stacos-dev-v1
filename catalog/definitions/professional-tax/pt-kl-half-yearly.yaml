title: Professional tax — Kerala half-yearly payment
plain_language_summary: >
  Kerala levies professional tax half-yearly through the panchayat or municipality
  where the establishment is located. Two payments a year, each due within a month
  of the half ending.
statutory_reference: Section 250 Kerala Municipality Act, 1994
periodicity: HALF_YEARLY
period_anchor: FY
jurisdictions: [IN-KL]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
