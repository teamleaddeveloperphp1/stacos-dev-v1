code: IN-PT-TN-HALF-YEARLY
country: IN
category: LABOUR
family: Professional tax
authority: MUNICIPAL
version: 1
title: Professional tax — Tamil Nadu half-yearly payment
plain_language_summary: >
  Tamil Nadu levies professional tax half-yearly through the local municipal body
  rather than the state, due within a month of each half ending. Which corporation
  or panchayat collects it depends on where the establishment sits.
statutory_reference: Section 138C Tamil Nadu Municipal Laws (Second Amendment) Act, 1998
periodicity: HALF_YEARLY
period_anchor: FY
jurisdictions: [IN-TN]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
applicability:
  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees whose salary attracts professional tax
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: -1 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment receipt, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Penalty of 2% per month on the amount due."
effective_from: 1998-10-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
