code: IN-PT-REGISTRATION-REVIEW
country: IN
category: LABOUR
family: Professional tax
authority: STATE_TAX
version: 1
title: Professional tax — annual review of state registrations
plain_language_summary: >
  A yearly check that every state you employ people in has the professional tax
  registration it requires — and that states which do not levy it, such as Delhi,
  Haryana and Uttar Pradesh, have not been registered in by mistake. Opening an
  office in a new state is the moment this is missed.
statutory_reference: Various state professional tax enactments
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees
    - fact: states_of_operation
      op: count_gte
      value: 2
      explain: you operate in more than one state, where registration gaps arise
due:
  anchor: FY_START
  offset: { months: 1, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: review, label: State-by-state registration review, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Unregistered operation attracts back tax with interest from the date of liability."
effective_from: 2015-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
