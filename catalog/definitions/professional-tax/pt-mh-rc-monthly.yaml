code: IN-PT-MH-RC-MONTHLY
country: IN
category: LABOUR
family: Professional tax
authority: STATE_TAX
version: 1
title: Professional tax — Maharashtra employer return (monthly)
plain_language_summary: >
  Tax deducted from employees' salaries in Maharashtra, paid and returned monthly
  by the last day of the following month. Employers whose annual liability is under
  ₹1,00,000 file annually instead, which is why two rules exist for one state.
statutory_reference: Section 6 Maharashtra State Tax on Professions, Trades, Callings and Employments Act, 1975
periodicity: MONTHLY
jurisdictions: [IN-MH]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
applicability:
  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    # Mutually exclusive with IN-PT-MH-RC-ANNUAL by construction. Two rules that
    # can both fire for one entity would put the same tax on the calendar twice.
    - fact: employee_count
      op: gte
      value: 20
      explain: your payroll is large enough that monthly filing applies
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: -1 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment challan, kind: DOC, mandatory_for_close: true }
  - { key: return, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Interest at 1.25% per month plus a late-filing fee of ₹1,000 per return."
effective_from: 1975-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
