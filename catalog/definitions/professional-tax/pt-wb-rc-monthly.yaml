code: IN-PT-WB-RC-MONTHLY
country: IN
category: LABOUR
family: Professional tax
authority: STATE_TAX
version: 1
title: Professional tax — West Bengal employer payment (monthly)
plain_language_summary: >
  West Bengal's monthly employer payment, due by the 21st. Employers with a small
  liability may pay quarterly, but the monthly rule is the default and the one that
  applies to most payrolls.
statutory_reference: Section 6 West Bengal State Tax on Professions, Trades, Callings and Employments Act, 1979
periodicity: MONTHLY
jurisdictions: [IN-WB]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
applicability:
  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees whose salary attracts professional tax
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 21 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Interest at 1% per month plus penalty."
effective_from: 1979-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
