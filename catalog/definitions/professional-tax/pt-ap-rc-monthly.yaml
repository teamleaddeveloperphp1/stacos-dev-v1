code: IN-PT-AP-RC-MONTHLY
country: IN
category: LABOUR
family: Professional tax
authority: STATE_TAX
version: 1
title: Professional tax — Andhra Pradesh employer payment (monthly)
plain_language_summary: >
  Andhra Pradesh's monthly employer payment, due by the 10th — one of the earliest
  professional tax deadlines in the country, and easy to miss in the first month
  after opening an office in the state.
statutory_reference: Section 7 Andhra Pradesh Tax on Professions, Trades, Callings and Employments Act, 1987
periodicity: MONTHLY
jurisdictions: [IN-AP]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
applicability:
  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees whose salary attracts professional tax
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 10 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Interest at 2% per month plus penalty up to twice the tax."
effective_from: 1987-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
