code: IN-PT-MP-RC-MONTHLY
country: IN
category: LABOUR
family: Professional tax
authority: STATE_TAX
version: 1
title: Professional tax — Madhya Pradesh employer payment (monthly)
plain_language_summary: >
  Madhya Pradesh's monthly employer payment, due by the 10th, with an annual
  return following. The slabs are among the lowest in the country, which does not
  make the notice for non-payment any smaller.
statutory_reference: Section 6 Madhya Pradesh Vritti Kar Adhiniyam, 1995
periodicity: MONTHLY
jurisdictions: [IN-MP]
instance_scope: REGISTRATION
scope_selector:
  registration_type: PT_RC
applicability:
  all:
    - fact: registrations
      op: includes
      value: PT_RC
      explain: you hold a professional tax registration certificate
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees whose salary attracts professional tax
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 10 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-hr
penalty_summary: "Interest at 2% per month plus penalty."
effective_from: 1995-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
