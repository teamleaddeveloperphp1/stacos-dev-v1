title: Personal data protection — annual review
plain_language_summary: >
  An annual review of what personal data is held, on what basis, for how long, and
  who it is shared with — plus the notice, consent and grievance mechanisms the
  DPDP Act requires. Penalties run to ₹250 crore, which puts this out of the
  category of housekeeping.
statutory_reference: Digital Personal Data Protection Act, 2023
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
