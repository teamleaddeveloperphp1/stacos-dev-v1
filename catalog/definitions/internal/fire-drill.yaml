title: Fire and evacuation drill
plain_language_summary: >
  A recorded evacuation drill every six months, with the time taken and the issues
  found. The record is what demonstrates that the emergency plan is real rather
  than a document, and it is asked for after any incident.
statutory_reference: Section 41B Factories Act, 1948; state fire safety rules
periodicity: HALF_YEARLY
period_anchor: FY
instance_scope: ENTITY
