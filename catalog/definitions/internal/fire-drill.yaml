    - fact: employee_count
      op: gte
      value: 50
      explain: you occupy premises where a documented evacuation plan is required
due:
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: -1 }
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: report, label: Drill report with timings and attendance, kind: DOC, mandatory_for_close: true }
default_owner_role: org-plant
penalty_summary: "Up to ₹1,00,000 under Section 92 where an on-site emergency plan is mandatory."
