code: IN-INT-REGISTRATION-SWEEP
country: IN
category: INTERNAL_GOVERNANCE
family: Internal governance
authority: INTERNAL
version: 1
title: Registrations and licences — half-yearly expiry sweep
plain_language_summary: >
  A single pass over every registration, licence, consent and certificate the
  business holds, checking expiry dates and recording them. Most licence lapses are
  not a failure to renew — they are a failure to know when the renewal was due.
statutory_reference: Internal control
periodicity: HALF_YEARLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: count_gte
      value: 3
      explain: you hold several registrations, where expiry dates are easily lost
due:
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: -1 }
  shift_if_holiday: NONE
evidence:
  - { key: register, label: Registration register with expiry dates, kind: DOC, mandatory_for_close: true }
default_owner_role: org-admin
penalty_summary: "No direct penalty; this is the control that prevents the ones that do carry penalties."
effective_from: 2015-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
