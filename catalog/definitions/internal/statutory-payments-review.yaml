code: IN-INT-STATUTORY-DUES-REVIEW
country: IN
category: INTERNAL_GOVERNANCE
family: Internal governance
authority: INTERNAL
version: 1
title: Statutory dues — quarterly outstanding review
plain_language_summary: >
  A quarterly check that no statutory due — GST, TDS, PF, ESIC, professional tax —
  is outstanding beyond its date. The auditor has to report undisputed dues
  outstanding for more than six months in the CARO report, so finding them at the
  audit is finding them too late.
statutory_reference: Clause 3(vii) Companies (Auditor's Report) Order, 2020
periodicity: QUARTERLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, OPC]
      explain: you are a company, and CARO reporting applies
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 15 }
  shift_if_holiday: NONE
evidence:
  - { key: schedule, label: Statutory dues ageing schedule, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "No direct penalty; adverse CARO reporting and directors' disqualification risk."
effective_from: 2020-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
