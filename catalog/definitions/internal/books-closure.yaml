title: Books of account — year-end closure and audit readiness
plain_language_summary: >
  Closing the books, confirming balances, and having the trial balance ready for
  the auditor. Everything downstream — the tax audit, the return, the ROC filings —
  is queued behind this one task, so slipping it by two weeks slips five statutory
  deadlines.
statutory_reference: Section 128 Companies Act, 2013
periodicity: ANNUAL
period_anchor: FY
