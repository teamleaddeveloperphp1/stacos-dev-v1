code: IN-GRATUITY-ACTUARIAL
country: IN
category: LABOUR
family: PF and ESIC
authority: STATE_LABOUR
version: 1
title: Gratuity — annual actuarial valuation
plain_language_summary: >
  The gratuity liability has to be measured by an actuary each year for the
  accounts. It is not a filing, but the auditor will not sign without it and
  obtaining a valuation takes several weeks, so it belongs on the calendar rather
  than in somebody's memory.
statutory_reference: Payment of Gratuity Act, 1972 r/w Ind AS 19
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: employee_count
      op: gte
      value: 10
      explain: you employ ten or more people, which brings the Gratuity Act into force
due:
  anchor: PERIOD_END
  offset: { months: 2, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: valuation, label: Actuarial valuation report, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "No statutory penalty; the audit cannot be completed without it."
effective_from: 1972-09-16
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
