title: UAN activation and KYC seeding
plain_language_summary: >
  Every member's universal account number has to be activated and seeded with
  Aadhaar and bank details. Without it a leaving employee cannot withdraw or
  transfer their balance — which is when it is discovered, at the worst possible
  moment.
statutory_reference: EPFO circular on UAN and Aadhaar seeding
