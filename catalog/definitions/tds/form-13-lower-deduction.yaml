code: IN-TDS-FORM13-RENEWAL
country: IN
category: TAX_DIRECT
family: TDS
authority: CBDT
version: 1
title: Form 13 — lower/nil deduction certificate renewal
plain_language_summary: >
  A certificate authorising a payer to deduct at a reduced rate expires with the
  financial year. Applying in March for the year ahead avoids two months of
  over-deduction that then has to be claimed back as a refund.
statutory_reference: Section 197 Income-tax Act r/w Rule 28AA
filing_portal_url: "https://www.tdscpc.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: PAN
      explain: you hold a PAN
    - fact: aggregate_turnover
      op: gt
      value: 100000000
      explain: your turnover is above ₹10 crore, where withholding materially affects cash flow
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, LLP, OPC]
      explain: you are a company or LLP
due:
  # Due before the year it covers begins, not after it ends.
  anchor: FY_START
  offset: { months: -1, day_of_month: 15 }
  shift_if_holiday: NONE
evidence:
  - { key: certificate, label: Certificate issued under Section 197, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "No penalty — but tax is over-deducted all year and refunded only after assessment."
effective_from: 2018-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
