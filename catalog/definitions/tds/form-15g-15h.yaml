code: IN-TDS-FORM15GH-UPLOAD
country: IN
category: TAX_DIRECT
family: TDS
authority: CBDT
version: 1
title: Form 15G/15H — quarterly upload of declarations received
plain_language_summary: >
  Declarations from payees asking you not to deduct tax have to be uploaded to the
  income tax portal every quarter. Holding the paper copy is not enough — an
  unuploaded declaration leaves you as the defaulter, not the payee.
statutory_reference: Rule 29C Income-tax Rules r/w Notification 9/2016
filing_portal_url: "https://www.incometax.gov.in"
periodicity: QUARTERLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: TAN
      explain: you hold a TAN
    - fact: entity_type
      op: not_in
      value: [PROPRIETORSHIP, HUF]
      explain: you are not an individual or HUF payer
due:
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: 15 }
  shift_if_holiday: NONE
evidence:
  - { key: upload_ack, label: Portal upload acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: declarations, label: Signed declarations received, kind: DOC }
default_owner_role: org-finance
penalty_summary: "The deduction default falls on you; interest and 271H penalty follow."
effective_from: 2016-06-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
