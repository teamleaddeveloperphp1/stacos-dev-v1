code: IN-TDS-24Q
country: IN
category: TAX_DIRECT
family: TDS
authority: CBDT
version: 1
title: Form 24Q — quarterly TDS return (salaries)
plain_language_summary: >
  The quarterly statement of tax deducted from salaries. Your employees' Form 26AS
  and their ability to claim the deduction depend on it, so a late 24Q produces
  angry staff before it produces a notice.
statutory_reference: Section 200(3) Income-tax Act r/w Rule 31A
filing_portal_url: "https://www.incometax.gov.in"
periodicity: QUARTERLY
# TDS quarters are fiscal-year anchored: Q1 is April–June, not January–March.
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: TAN
      explain: you hold a TAN
    - fact: employee_count
      op: gte
      value: 1
      explain: you have employees on payroll
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 31 }
  # Q4 (January–March) is due 31 May, not 30 April.
  offset_by_month:
    3: { months: 2, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Return acknowledgement (token number), kind: DOC, mandatory_for_close: true }
  - { key: fvu, label: Validated FVU file, kind: DOC }
steps:
  - key: confirm_applies
    label: Confirm TDS applies this quarter
    role: PREPARE
    default_owner_role: org-owner
    days_before_due: 45
  - key: pull_salary_registers
    label: Pull the quarter's salary registers
    role: PREPARE
    default_owner_role: org-owner
    days_before_due: 35
  - key: reconcile_challans
    label: Reconcile challans against Form 26AS
    role: PREPARE
    default_owner_role: org-owner
    days_before_due: 25
  - key: validate_pans
    label: Validate PANs for every employee
    role: REVIEW
    default_owner_role: org-owner
    days_before_due: 20
  - key: generate_fvu
    label: Generate and validate the FVU file
    role: PREPARE
    default_owner_role: org-owner
    days_before_due: 10
    requires_evidence: true
  - key: signoff
    label: Sign off on the filing pack
    role: APPROVE
    default_owner_role: org-owner
    days_before_due: 5
  - key: file_return
    label: Sign with DSC and file
    role: SIGN
    default_owner_role: org-owner
    days_before_due: 0
    requires_evidence: true
default_owner_role: org-owner
penalty_summary: "₹200 per day under Section 234E until filed, capped at the TDS amount; ₹10,000–₹1,00,000 under 271H."
penalty_rules:
  - kind: PER_DAY_CAPPED
    rate_minor: 20000
    statutory_reference: "Section 234E"
    # No cap_minor: the real cap is "the TDS amount", which STACOS does not
    # store on an obligation — shown as a rate and reference, not a total.
  - kind: FIXED_RANGE
    min_minor: 1000000
    max_minor: 10000000
    statutory_reference: "Section 271H"
effective_from: 2010-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
