code: IN-TDS-27Q
country: IN
category: TAX_DIRECT
family: TDS
authority: CBDT
version: 1
title: Form 27Q — quarterly TDS return (payments to non-residents)
plain_language_summary: >
  The quarterly statement for tax deducted on payments made outside India —
  royalties, technical fees, interest, dividends. It sits alongside the Form 15CA
  and 15CB filed at the time of each remittance.
statutory_reference: Section 200(3) Income-tax Act r/w Rule 31A
filing_portal_url: "https://www.incometax.gov.in"
periodicity: QUARTERLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: TAN
      explain: you hold a TAN
    - any:
        - fact: has_foreign_shareholding
          op: eq
          value: true
          explain: you have foreign shareholders who may receive payments
        - fact: has_export_import
          op: eq
          value: true
          explain: you transact across borders
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 31 }
  offset_by_month:
    3: { months: 2, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Return acknowledgement (token number), kind: DOC, mandatory_for_close: true }
  - { key: form15ca, label: Form 15CA/15CB for the remittances, kind: DOC }
default_owner_role: org-finance
penalty_summary: "₹200 per day under Section 234E, capped at the TDS amount."
effective_from: 2010-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
