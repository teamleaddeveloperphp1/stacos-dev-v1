code: IN-TCS-FORM27D
country: IN
category: TAX_DIRECT
family: TDS
authority: CBDT
version: 1
title: Form 27D — quarterly TCS certificate
plain_language_summary: >
  The certificate issued to buyers for tax collected at source, so they can claim
  it against their own liability. Issued from TRACES fifteen days after the 27EQ
  return.
statutory_reference: Section 206C(5) Income-tax Act r/w Rule 37D
filing_portal_url: "https://www.tdscpc.gov.in"
periodicity: QUARTERLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: TAN
      explain: you hold a TAN
    - any:
        - fact: has_export_import
          op: eq
          value: true
          explain: you deal in imports or exports
        - fact: has_factory_premises
          op: eq
          value: true
          explain: you operate a factory, where scrap sales attract TCS
due:
  anchor: PERIOD_END
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: certificates, label: Certificates downloaded from TRACES, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹100 per day per certificate under Section 272A(2)(g)."
effective_from: 2010-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
