code: IN-TDS-PAYMENT-MONTHLY
country: IN
category: TAX_DIRECT
family: TDS
authority: CBDT
version: 1
title: TDS payment — monthly challan
plain_language_summary: >
  Tax deducted from salaries, rent, contractor bills and professional fees has to
  reach the government by the 7th of the following month. March is the exception:
  that deposit is due 30 April. Late payment carries interest at 1.5% per month
  and, for the deductee, a credit that does not show up in their Form 26AS.
statutory_reference: Section 200 Income-tax Act r/w Rule 30
filing_portal_url: "https://www.incometax.gov.in"
periodicity: MONTHLY
instance_scope: ENTITY
applicability:
  all:
    - fact: registrations
      op: includes
      value: TAN
      explain: you hold a TAN and therefore deduct tax at source
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 7 }
  # March is genuinely different — 30 April, not 7 April. Expressing it as a
  # second definition would duplicate the applicability rule and the two copies
  # would drift apart within a year.
  offset_by_month:
    3: { months: 1, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: Challan ITNS-281 with BSR code, kind: DOC, mandatory_for_close: true }
  - { key: working, label: Deduction working for the month, kind: DOC }
default_owner_role: org-finance
penalty_summary: "Interest at 1.5% per month from deduction to deposit; disallowance of the expense if unpaid."
effective_from: 2010-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
