code: IN-LIC-IEC-UPDATE
country: IN
category: LICENSING
family: Trade licences
authority: DGFT
version: 1
title: Importer Exporter Code — annual update
plain_language_summary: >
  The IEC must be confirmed or updated between April and June every year, even when
  nothing has changed. An IEC that is not updated is deactivated automatically —
  and a deactivated IEC stops a consignment at the port.
statutory_reference: Paragraph 2.05(e) Foreign Trade Policy
filing_portal_url: "https://www.dgft.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: REGISTRATION
scope_selector:
  registration_type: IEC
applicability:
  all:
    - fact: registrations
      op: includes
      value: IEC
      explain: you hold an Importer Exporter Code
due:
  anchor: FY_START
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Updated IEC certificate, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "IEC deactivated; imports and exports cannot be cleared until reactivated."
