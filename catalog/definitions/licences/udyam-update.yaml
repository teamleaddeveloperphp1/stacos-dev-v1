title: Udyam registration — annual update
plain_language_summary: >
  Udyam registration has to be updated each year with turnover and investment
  figures, which are pulled from the income tax and GST returns. Failing to update
  suspends the registration, and with it the delayed-payment protection under the
  MSMED Act.
statutory_reference: Paragraph 8 Udyam Registration Notification, 2020
