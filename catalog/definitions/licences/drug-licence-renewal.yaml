title: Drug licence — renewal
plain_language_summary: >
  Manufacturing or selling drugs requires a licence from the state licensing
  authority, renewed on a five-year cycle with a retention fee. Lapsing means
  stopping production, and the reinstatement route is a fresh application with a
  fresh inspection.
statutory_reference: Rule 64 Drugs and Cosmetics Rules, 1945
periodicity: ANNUAL
