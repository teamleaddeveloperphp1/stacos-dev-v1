title: FSSAI licence renewal
plain_language_summary: >
  A food licence must be renewed before it expires — applications made after expiry
  are treated as fresh, not as renewals, which means starting the process from the
  beginning while trading is unlawful.
statutory_reference: Regulation 2.1.7 FSS (Licensing and Registration of Food Businesses) Regulations, 2011
