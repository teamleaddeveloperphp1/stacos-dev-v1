title: Legal metrology — weights and measures verification
plain_language_summary: >
  Every weighing and measuring instrument used in trade must be verified and
  stamped annually by the legal metrology department. Packers and importers also
  need a separate registration for declarations on packaged commodities.
statutory_reference: Section 24 Legal Metrology Act, 2009 r/w Rule 15
periodicity: ANNUAL
period_anchor: FY
