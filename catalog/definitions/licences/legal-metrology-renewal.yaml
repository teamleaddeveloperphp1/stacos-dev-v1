    - fact: registrations
      op: includes
      value: LEGAL_METROLOGY
      explain: you hold a legal metrology registration
due:
  anchor: FY_START
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars: [IN-NATIONAL]
