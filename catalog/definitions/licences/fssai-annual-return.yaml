code: IN-LIC-FSSAI-ANNUAL-RETURN
country: IN
category: LICENSING
family: Sector licences
authority: FSSAI
version: 1
title: FSSAI annual return (Form D1)
plain_language_summary: >
  Manufacturers, importers and packers of food file an annual return of quantities
  handled by 31 May. Restaurants and retailers are exempt, which is why the rule
  keys on manufacturing rather than on holding the licence.
statutory_reference: Regulation 2.1.13 FSS (Licensing and Registration) Regulations, 2011
filing_portal_url: "https://foscos.fssai.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: REGISTRATION
scope_selector:
  registration_type: FSSAI
applicability:
  all:
    - fact: registrations
      op: includes
      value: FSSAI
      explain: you hold an FSSAI licence
    - fact: has_factory_premises
      op: eq
      value: true
      explain: you manufacture or pack food, rather than only serving it
due:
  anchor: PERIOD_END
  offset: { months: 2, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: return, label: Filed Form D1, kind: DOC, mandatory_for_close: true }
default_owner_role: org-plant
penalty_summary: "₹100 per day of delay."
effective_from: 2011-08-05
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
