code: IN-FEMA-APR-ODI
country: IN
category: FEMA_RBI
family: FEMA
authority: RBI
version: 1
title: APR — annual performance report on overseas investment
plain_language_summary: >
  An Indian company holding a stake in a foreign entity files an annual performance
  report for each overseas entity by 31 December, based on that entity's audited
  accounts. Until it is filed, no further remittance to that entity is permitted.
statutory_reference: Regulation 15 FEM (Overseas Investment) Rules, 2022
filing_portal_url: "https://firms.rbi.org.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: has_foreign_shareholding
      op: eq
      value: true
      explain: you have cross-border investment relationships
    - fact: net_worth
      op: gte
      value: 100000000
      explain: your net worth supports an overseas investment
due:
  anchor: PERIOD_END
  offset: { months: 9, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: apr, label: Filed APR with AD bank certification, kind: DOC, mandatory_for_close: true }
  - { key: accounts, label: Overseas entity audited accounts, kind: DOC }
default_owner_role: org-finance
penalty_summary: "Further remittances blocked; compounding under Section 13 FEMA."
effective_from: 2022-08-22
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
