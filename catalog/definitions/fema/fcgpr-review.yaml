code: IN-FEMA-FCGPR-REVIEW
country: IN
category: FEMA_RBI
family: FEMA
authority: RBI
version: 1
title: FC-GPR and FC-TRS — annual review of unreported transactions
plain_language_summary: >
  Every issue of shares to a non-resident must be reported in FC-GPR within thirty
  days of allotment, and every transfer in FC-TRS within sixty days. Both are
  event-driven and both are missed. An annual sweep against the share register is
  how the gaps are found while they are still compoundable cheaply.
statutory_reference: Regulation 4 FEM (Non-debt Instruments) Rules, 2019
filing_portal_url: "https://firms.rbi.org.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: has_foreign_shareholding
      op: eq
      value: true
      explain: you have foreign shareholding
due:
  anchor: PERIOD_END
  offset: { months: 2, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: review, label: Share register reconciliation against filings, kind: DOC, mandatory_for_close: true }
default_owner_role: org-secretarial
penalty_summary: "Late submission fee per filing; compounding up to three times the amount involved."
effective_from: 2019-10-17
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
