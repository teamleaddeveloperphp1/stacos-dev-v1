code: IN-FEMA-ECB2
country: IN
category: FEMA_RBI
family: FEMA
authority: RBI
version: 1
title: ECB-2 — monthly return on external commercial borrowings
plain_language_summary: >
  A borrower with an external commercial borrowing files a monthly return through
  its authorised dealer bank within seven working days of the month ending. It
  continues every month until the loan is fully repaid, including months with no
  movement.
statutory_reference: Paragraph 5.5 RBI Master Direction on External Commercial Borrowings
periodicity: MONTHLY
instance_scope: ENTITY
applicability:
  all:
    - fact: has_foreign_shareholding
      op: eq
      value: true
      explain: you have a foreign parent or lender relationship
    - fact: aggregate_turnover
      op: gt
      value: 500000000
      explain: your scale is consistent with external commercial borrowing
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 7 }
  # Filed through a bank, so it genuinely depends on a working day.
  shift_if_holiday: NEXT_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: return, label: ECB-2 return certified by the AD bank, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "Late submission fee per return; persistent default is a FEMA contravention."
effective_from: 2019-01-16
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
