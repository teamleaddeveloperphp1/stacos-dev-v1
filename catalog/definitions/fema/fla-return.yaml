code: IN-FEMA-FLA-RETURN
country: IN
category: FEMA_RBI
family: FEMA
authority: RBI
version: 1
title: FLA — annual return on foreign liabilities and assets
plain_language_summary: >
  Any company that has received foreign direct investment or made overseas
  investment files this return by 15 July, using provisional figures if the audit
  is not complete. Filing late is a compoundable contravention, not a fee.
statutory_reference: Section 6(3) FEMA, 1999 r/w FEM (Transfer or Issue of Security) Regulations
filing_portal_url: "https://flair.rbi.org.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: has_foreign_shareholding
      op: eq
      value: true
      explain: you have foreign shareholding
due:
  anchor: PERIOD_END
  offset: { months: 3, day_of_month: 15 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: FLAIR submission acknowledgement, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "Compounding under Section 13 FEMA — up to three times the amount involved."
effective_from: 2011-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
