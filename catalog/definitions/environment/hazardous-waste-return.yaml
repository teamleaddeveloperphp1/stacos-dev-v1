title: Hazardous waste — annual return (Form 4)
plain_language_summary: >
  An annual return of hazardous waste generated, stored, disposed of and sent to
  authorised recyclers, due 30 June. The quantities have to reconcile with the
  manifests, and a mismatch is treated as unaccounted waste.
statutory_reference: Rule 20(2) Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016
