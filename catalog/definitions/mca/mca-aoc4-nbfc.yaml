title: AOC-4 NBFC — filing of NBFC financial statements
plain_language_summary: An NBFC files its financial statements on the NBFC variant of AOC-4, not the ordinary
  one. Same thirty days after the meeting; a different form, and filing the wrong one is a rejection rather
  than a late filing.
statutory_reference: Section 137 Companies Act, 2013 r/w applicable Companies (Accounts) / filing rules
  for NBFCs
