code: IN-MCA-MGT8
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: MGT-8 — certification of annual return, where applicable
plain_language_summary: Larger companies must have the annual return certified by a practising company
  secretary before it is filed. Obtained ahead of MGT-7, because MGT-7 cannot be filed without it.
statutory_reference: Section 92(2) Companies Act, 2013 r/w Rule 11 Companies (Management and Administration)
  Rules, 2014
tags:
- roc
- annual-return
- certificate
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - SECTION_8
    explain: you are a company
  - any:
    - fact: is_listed
      op: eq
      value: true
      explain: you are listed
    - fact: paid_up_capital
      op: gte
      value: 100000000
      explain: your paid-up capital is ₹10 crore or more
    - fact: aggregate_turnover
      op: gte
      value: 2500000000
      explain: your turnover is ₹250 crore or more
due:
  anchor: EVENT_DATE
  event_key: AGM_DATE
  offset:
    days: 45
  shift_if_holiday: NONE
evidence:
- key: mgt8
  label: MGT-8 certificate
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-secretarial
penalty_summary: Incorrect certification or failure to obtain required certification can attract statutory
  and professional penalties.
effective_from: '2014-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
