code: IN-MCA-AOC4-XBRL
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: AOC-4 XBRL — financial statements in XBRL format
plain_language_summary: >
  Listed companies and larger unlisted ones file the same accounts again in XBRL.
  Preparing the taxonomy tagging takes longer than people expect, and it cannot
  start until the audit is signed.
statutory_reference: Rule 3 Companies (Filing of Documents and Forms in XBRL) Rules, 2015
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD]
      explain: you are a company
    - any:
        - fact: is_listed
          op: eq
          value: true
          explain: you are listed on a stock exchange
        - fact: paid_up_capital
          op: gte
          value: 50000000
          explain: your paid-up capital is ₹5 crore or more
        - fact: aggregate_turnover
          op: gte
          value: 1000000000
          explain: your turnover is ₹100 crore or more
due:
  anchor: EVENT_DATE
  event_key: AGM_DATE
  offset: { days: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN and challan, kind: DOC, mandatory_for_close: true }
  - { key: xbrl, label: Validated XBRL instance document, kind: DOC, mandatory_for_close: true }
default_owner_role: org-secretarial
penalty_summary: "₹100 per day with no cap."
effective_from: 2015-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
