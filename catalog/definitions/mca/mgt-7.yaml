code: IN-MCA-MGT7
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: MGT-7 — annual return
plain_language_summary: >
  The annual return sets out shareholding, directors, meetings held and changes
  during the year, filed within sixty days of the annual general meeting. It is a
  public document and the first thing a due-diligence exercise pulls.
statutory_reference: Section 92 Companies Act, 2013 r/w Rule 11
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, SECTION_8]
      explain: you are a company
    - any:
        - fact: is_listed
          op: eq
          value: true
          explain: you are a listed company
        - fact: paid_up_capital
          op: gte
          value: 40000000
          explain: your paid-up capital is above the small-company threshold
        - fact: aggregate_turnover
          op: gte
          value: 400000000
          explain: your turnover is above the small-company threshold
due:
  anchor: EVENT_DATE
  event_key: AGM_DATE
  offset: { days: 60 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN and challan, kind: DOC, mandatory_for_close: true }
  - { key: return, label: Signed annual return, kind: DOC, mandatory_for_close: true }
default_owner_role: org-secretarial
penalty_summary: "₹100 per day with no cap; ₹50,000 on the company plus ₹100 per day on officers."
effective_from: 2021-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
