code: IN-MCA-CSR2
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: CSR-2 — report on corporate social responsibility
plain_language_summary: >
  A separate return of CSR spending for companies that cross the net worth, turnover
  or profit thresholds. Unspent amounts have to be transferred to a specified fund
  within six months, so the reporting and the money move on different clocks.
statutory_reference: Rule 12(1B) Companies (Accounts) Rules, 2014
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD]
      explain: you are a company
    - any:
        - fact: net_worth
          op: gte
          value: 5000000000
          explain: your net worth is ₹500 crore or more
        - fact: aggregate_turnover
          op: gte
          value: 10000000000
          explain: your turnover is ₹1,000 crore or more
        - fact: net_profit
          op: gte
          value: 50000000
          explain: your net profit is ₹5 crore or more
due:
  anchor: PERIOD_END
  offset: { months: 9, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN and challan, kind: DOC, mandatory_for_close: true }
  - { key: csr_report, label: CSR annexure to the board's report, kind: DOC }
default_owner_role: org-secretarial
penalty_summary: "Twice the unspent amount or ₹1 crore, whichever is less, plus officer penalties."
effective_from: 2022-02-11
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
