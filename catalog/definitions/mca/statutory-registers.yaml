title: Statutory registers — annual review and update
plain_language_summary: >
  Registers of members, directors, charges, contracts and loans must be kept
  current and produced on demand. Nobody is fined for a register being untidy on an
  ordinary Tuesday — but a due-diligence exercise or an inspection asks for all of
  them at once, and reconstructing four years of entries is a fortnight's work.
statutory_reference: Sections 85, 88, 170, 189 Companies Act, 2013
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, OPC, SECTION_8]
      explain: you are a company
due:
  anchor: PERIOD_END
  offset: { months: 3, day_of_month: 30 }
  shift_if_holiday: NONE
