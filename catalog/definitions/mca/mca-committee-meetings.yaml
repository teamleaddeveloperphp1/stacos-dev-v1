code: IN-MCA-COMMITTEE-MEETINGS
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Statutory committee meetings — scheduling, attendance and minutes
plain_language_summary: Audit, nomination and stakeholder committees each have their own frequency, and
  for a listed company the listing regulations impose tighter ones than the Companies Act. Scheduled per
  quarter and reconciled against what the company's own constitution requires.
statutory_reference: Companies Act, 2013 and applicable committee rules / Secretarial Standards
trigger_kind: GOVERNANCE
tags:
- roc
- board-meeting
- minutes
- governance
periodicity: QUARTERLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - SECTION_8
    explain: you are a company
  - any:
    - fact: is_listed
      op: eq
      value: true
      explain: you are listed
    - fact: paid_up_capital
      op: gte
      value: 100000000
      explain: your paid-up capital is ₹10 crore or more
    - fact: aggregate_turnover
      op: gte
      value: 2500000000
      explain: your turnover is ₹250 crore or more
due:
  anchor: PERIOD_END
  offset:
    months: 0
    day_of_month: -1
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars:
  - IN-NATIONAL
evidence:
- key: minutes
  label: Committee minutes
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-secretarial
penalty_summary: Penalties depend on the specific committee obligation and applicable law.
effective_from: '2014-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
