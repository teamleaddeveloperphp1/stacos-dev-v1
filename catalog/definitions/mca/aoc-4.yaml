code: IN-MCA-AOC4
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: AOC-4 — filing of financial statements
plain_language_summary: >
  The audited accounts are filed with the Registrar within thirty days of the
  annual general meeting. Because the date depends on when that meeting was
  actually held, we cannot schedule it until you tell us — a guessed date here
  would be worse than none.
statutory_reference: Section 137 Companies Act, 2013 r/w Rule 12
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, OPC, SECTION_8]
      explain: you are a company
due:
  # Unresolvable until an AGM date is recorded. The obligation still materialises,
  # with a null date and a prompt — a calendar that says what it does not know is
  # more useful than one that guesses.
  anchor: EVENT_DATE
  event_key: AGM_DATE
  offset: { days: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN and challan, kind: DOC, mandatory_for_close: true }
  - { key: financials, label: Audited financial statements, kind: DOC, mandatory_for_close: true }
  - { key: board_report, label: Board's report with annexures, kind: DOC }
default_owner_role: org-secretarial
penalty_summary: "₹100 per day with no cap, plus penalties on the company and every officer in default."
effective_from: 2014-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
