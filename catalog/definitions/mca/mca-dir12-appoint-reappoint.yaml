code: IN-MCA-DIR12-APPOINT-REAPPOINT
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Director appointment / reappointment — ROC filing
plain_language_summary: A reappointment at the annual general meeting still reaches the Registrar through
  DIR-12. Distinct from a fresh appointment because the underlying resolution and the board process differ.
statutory_reference: Sections 152 and 170 Companies Act, 2013 r/w Rule 18 Companies (Appointment and Qualification
  of Directors) Rules, 2014
trigger_kind: EVENT_DRIVEN
tags:
- roc
- director
periodicity: EVENT_BASED
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - OPC
    - SECTION_8
    explain: you are a company
trigger:
  event_key: DIRECTOR_APPOINTED
  when:
    any:
    - fact: is_reappointment
      op: eq
      value: true
      explain: this was a reappointment rather than a fresh appointment
due:
  anchor: TRIGGER_DATE
  offset:
    days: 30
  shift_if_holiday: NONE
evidence:
- key: srn
  label: DIR-12 SRN and challan
  kind: DOC
  mandatory_for_close: true
- key: resolution
  label: Resolution
  kind: DOC
default_owner_role: org-secretarial
penalty_summary: Additional filing fee and statutory penalties may apply for default.
effective_from: '2014-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
