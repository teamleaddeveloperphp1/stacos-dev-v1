code: IN-MCA-SECRETARIAL-AUDIT-MR3
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Secretarial audit — MR-3 for prescribed companies
plain_language_summary: Prescribed companies annex a secretarial audit report to the Board's Report. It
  is an audit of compliance itself, carried out by a practising company secretary, and its qualifications
  are read closely by lenders.
statutory_reference: Section 204 Companies Act, 2013 r/w Rule 9 Companies (Appointment and Remuneration
  of Managerial Personnel) Rules, 2014
tags:
- roc
- secretarial-audit
- audit-report
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - SECTION_8
    explain: you are a company
  - any:
    - fact: is_listed
      op: eq
      value: true
      explain: you are listed
    - fact: paid_up_capital
      op: gte
      value: 100000000
      explain: your paid-up capital is ₹10 crore or more
    - fact: aggregate_turnover
      op: gte
      value: 2500000000
      explain: your turnover is ₹250 crore or more
due:
  anchor: PERIOD_END
  offset:
    months: 6
    day_of_month: 30
  shift_if_holiday: NONE
evidence:
- key: mr3
  label: MR-3 secretarial audit report
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-secretarial
penalty_summary: Contravention attracts penalties on the company, officers and practising company secretary
  under Section 204.
effective_from: '2014-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
