code: IN-MCA-AOC4-CFS
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: AOC-4 CFS — consolidated financial statements
plain_language_summary: >
  A company with subsidiaries, associates or joint ventures files consolidated
  accounts in addition to its own. The consolidation cannot be finalised until
  every subsidiary's audit is complete, which is why group year-ends are worth
  aligning.
statutory_reference: Section 129(3) Companies Act, 2013 r/w Rule 6
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD]
      explain: you are a company
    - fact: net_worth
      op: gte
      value: 500000000
      explain: your net worth suggests a group structure requiring consolidation
due:
  anchor: EVENT_DATE
  event_key: AGM_DATE
  offset: { days: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN and challan, kind: DOC, mandatory_for_close: true }
  - { key: cfs, label: Consolidated financial statements, kind: DOC, mandatory_for_close: true }
default_owner_role: org-secretarial
penalty_summary: "₹100 per day with no cap."
effective_from: 2014-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
