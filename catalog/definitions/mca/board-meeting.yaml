code: IN-MCA-BOARD-MEETING
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Board meeting — quarterly
plain_language_summary: >
  A company must hold at least four board meetings a year with no more than 120
  days between any two. The gap rule is what bites: four meetings crammed into six
  months satisfies the count and breaches the interval.
statutory_reference: Section 173 Companies Act, 2013
periodicity: QUARTERLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, SECTION_8]
      explain: you are a company
    - fact: is_dormant
      op: ne
      value: true
      explain: you are not dormant
due:
  # Scheduled at the quarter end. The 120-day interval rule is a constraint on the
  # *sequence*, and projecting it more than a quarter or two ahead is speculation
  # rather than a commitment — so the calendar schedules a meeting per quarter and
  # the interval is checked against what was actually held.
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: -1 }
  shift_if_holiday: PREVIOUS_WORKING_DAY
  calendars: [IN-NATIONAL]
evidence:
  - { key: notice, label: Notice of the meeting, kind: DOC }
  - { key: minutes, label: Signed minutes, kind: DOC, mandatory_for_close: true }
  - { key: attendance, label: Attendance register, kind: DOC }
default_owner_role: org-secretarial
penalty_summary: "₹25,000 on every officer in default."
effective_from: 2014-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
