code: IN-MCA-MANAGERIAL-REMUNERATION-DISCLOSURE
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Managerial remuneration — annual disclosure
plain_language_summary: The prescribed remuneration disclosures in the Board's Report — ratios to median
  employee remuneration, percentage increases, and the named particulars for the highest-paid.
statutory_reference: Section 197(12) Companies Act, 2013 r/w Rule 5 Companies (Appointment and Remuneration
  of Managerial Personnel) Rules, 2014
tags:
- roc
- remuneration
- disclosure
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - SECTION_8
    explain: you are a company
  - any:
    - fact: is_listed
      op: eq
      value: true
      explain: you are listed
    - fact: paid_up_capital
      op: gte
      value: 100000000
      explain: your paid-up capital is ₹10 crore or more
    - fact: aggregate_turnover
      op: gte
      value: 2500000000
      explain: your turnover is ₹250 crore or more
due:
  anchor: PERIOD_END
  offset:
    months: 6
    day_of_month: 30
  shift_if_holiday: NONE
evidence:
- key: disclosure
  label: Remuneration disclosure
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-secretarial
penalty_summary: No separate filing penalty; non-compliance is dealt with under the applicable substantive
  provision.
effective_from: '2014-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
