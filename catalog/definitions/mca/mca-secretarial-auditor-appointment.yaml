code: IN-MCA-SECRETARIAL-AUDITOR-APPOINTMENT
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Secretarial auditor — appointment / engagement
plain_language_summary: Appointed early enough that the audit can actually be completed before the Board's
  Report is signed. Appointing in September for a report due in October is how a qualification ends up
  in the report.
statutory_reference: Section 204 Companies Act, 2013 r/w applicable rules
trigger_kind: EVENT_DRIVEN
tags:
- roc
- secretarial-audit
periodicity: EVENT_BASED
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - SECTION_8
    explain: you are a company
  - any:
    - fact: is_listed
      op: eq
      value: true
      explain: you are listed
    - fact: paid_up_capital
      op: gte
      value: 100000000
      explain: your paid-up capital is ₹10 crore or more
    - fact: aggregate_turnover
      op: gte
      value: 2500000000
      explain: your turnover is ₹250 crore or more
trigger:
  event_key: SECRETARIAL_AUDITOR_APPOINTED
due:
  anchor: TRIGGER_DATE
  offset:
    days: 0
  shift_if_holiday: NONE
evidence:
- key: engagement
  label: Board resolution or engagement letter
  kind: DOC
  mandatory_for_close: true
default_owner_role: org-secretarial
penalty_summary: No separate filing penalty; failure to obtain the required secretarial audit attracts
  Section 204 consequences.
effective_from: '2014-04-01'
reviewed_by: Skorydov compliance desk
reviewed_at: '2026-09-03'
confidence: MEDIUM
