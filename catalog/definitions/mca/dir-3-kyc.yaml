code: IN-MCA-DIR3-KYC
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: DIR-3 KYC — annual director KYC
plain_language_summary: >
  Every person holding a DIN must confirm their details by 30 September each year.
  Miss it and the DIN is deactivated — which means that director cannot sign any
  filing for any company until a ₹5,000 fee is paid to reactivate it.
statutory_reference: Rule 12A Companies (Appointment and Qualification of Directors) Rules, 2014
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, OPC, SECTION_8, LLP]
      explain: you have directors or designated partners holding a DIN
due:
  anchor: PERIOD_END
  offset: { months: 6, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN for each director, kind: DOC, mandatory_for_close: true }
default_owner_role: org-secretarial
penalty_summary: "DIN deactivated; ₹5,000 per director to reactivate."
effective_from: 2018-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
