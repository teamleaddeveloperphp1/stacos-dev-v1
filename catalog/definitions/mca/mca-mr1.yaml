code: IN-MCA-MR1
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: MR-1 — return of appointment of MD / WTD / Manager
plain_language_summary: A managing director, whole-time director or manager is reported separately from
  an ordinary director, on a longer clock — sixty days rather than thirty — and with the terms of appointment
  attached.
statutory_reference: Section 196 Companies Act, 2013 r/w Rule 3 Companies (Appointment and Remuneration
  of Managerial Personnel) Rules, 2014
trigger_kind: EVENT_DRIVEN
tags:
- roc
- kmp
- remuneration
periodicity: EVENT_BASED
instance_scope: ENTITY
applicability:
  all:
  - fact: entity_type
    op: in
    value:
    - PVT_LTD
    - PUBLIC_LTD
    - SECTION_8
    explain: you are a company that holds general meetings
trigger:
  event_key: DIRECTOR_APPOINTED
  when:
    any:
    - fact: role
      op: in
      value:
      - MD
      - WTD
      - MANAGER
      explain: the appointment was of a managing or whole-time director, or a manager
due:
  anchor: TRIGGER_DATE
  offset:
    days: 60
  shift_if_holiday: NONE
evidence:
- key: srn
  label: MR-1 SRN
  kind: DOC
  mandatory_for_close: true
- key: terms
  label: Terms of appointment
  kind: DOC
default_owner_role: org-secretarial
penalty_summary: Additional filing fee and statutory penalties may apply for default.
