code: IN-MCA-PAS6
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: PAS-6 — half-yearly reconciliation of share capital audit
plain_language_summary: >
  A half-yearly certificate reconciling issued capital with what is actually held
  in dematerialised form, certified by a company secretary or chartered
  accountant. Required of unlisted public companies since dematerialisation became
  compulsory for them.
statutory_reference: Rule 9A(8) Companies (Prospectus and Allotment of Securities) Rules, 2014
filing_portal_url: "https://www.mca.gov.in"
periodicity: HALF_YEARLY
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: eq
      value: PUBLIC_LTD
      explain: you are a public company
    - fact: is_listed
      op: ne
      value: true
      explain: you are unlisted, where PAS-6 applies
due:
  anchor: PERIOD_END
  offset: { months: 2, day_of_month: -1 }
  shift_if_holiday: NONE
evidence:
  - { key: srn, label: SRN and challan, kind: DOC, mandatory_for_close: true }
  - { key: certificate, label: Reconciliation certificate, kind: DOC, mandatory_for_close: true }
default_owner_role: org-secretarial
penalty_summary: "Up to ₹10,000 plus ₹1,000 per day of continuing default."
effective_from: 2019-09-30
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
