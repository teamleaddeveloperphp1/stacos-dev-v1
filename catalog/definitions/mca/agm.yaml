code: IN-MCA-AGM
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Annual general meeting
plain_language_summary: >
  A company must hold its annual general meeting within six months of the year
  end. Almost every other ROC filing is dated from this meeting, so it is the
  first domino: holding it late makes AOC-4, MGT-7 and ADT-1 late as a matter of
  arithmetic.
statutory_reference: Section 96 Companies Act, 2013
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD, SECTION_8]
      explain: you are a company, and only companies hold an AGM
due:
  anchor: PERIOD_END
  offset: { months: 6, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: notice, label: Notice of the meeting, kind: DOC }
  - { key: minutes, label: Signed minutes, kind: DOC, mandatory_for_close: true }
  - { key: attendance, label: Attendance register, kind: DOC }
default_owner_role: org-secretarial
penalty_summary: "Up to ₹1,00,000 on the company and ₹5,000 per day of continuing default on officers."
effective_from: 2014-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
