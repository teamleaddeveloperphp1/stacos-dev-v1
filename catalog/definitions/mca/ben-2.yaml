code: IN-MCA-BEN2-REVIEW
country: IN
category: CORPORATE_SECRETARIAL
family: ROC
authority: MCA
version: 1
title: Significant beneficial ownership — annual review and BEN-2 filing
plain_language_summary: >
  An annual check that the register of significant beneficial owners is current,
  and a BEN-2 filing where a declaration has been received. Ownership through
  layered holding structures is what this is aimed at, and it changes more often
  than anyone remembers to report.
statutory_reference: Section 90 Companies Act, 2013 r/w SBO Rules, 2018
filing_portal_url: "https://www.mca.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: ENTITY
applicability:
  all:
    - fact: entity_type
      op: in
      value: [PVT_LTD, PUBLIC_LTD]
      explain: you are a company
    - fact: has_foreign_shareholding
      op: eq
      value: true
      explain: you have foreign or layered shareholding, where beneficial ownership needs tracing
due:
  anchor: PERIOD_END
  offset: { months: 6, day_of_month: 30 }
  shift_if_holiday: NONE
evidence:
  - { key: register, label: Register of significant beneficial owners (BEN-3), kind: DOC, mandatory_for_close: true }
  - { key: declarations, label: BEN-1 declarations received, kind: DOC }
default_owner_role: org-secretarial
penalty_summary: "₹1,00,000 on the company plus ₹500 per day of continuing default."
effective_from: 2019-02-08
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
