code: IN-GST-GSTR9
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-9 — annual return
plain_language_summary: >
  The annual consolidation of every monthly return, with the reconciliations the
  department will compare against your books. Optional below ₹2 crore of turnover
  and mandatory above it.
statutory_reference: Section 44 CGST Act r/w Rule 80
filing_portal_url: "https://www.gst.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: REGULAR
      explain: you are registered under the regular scheme
    - fact: aggregate_turnover
      op: gt
      value: 20000000
      explain: your annual aggregate turnover is above ₹2 crore
due:
  # FY 2025-26 closes on 31 March 2026 and falls due on 31 December 2026. A
  # horizon filtered by period rather than by due date loses this entirely.
  anchor: PERIOD_END
  offset: { months: 9, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: recon, label: Books-to-return reconciliation, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹200 per day, capped at 0.5% of turnover in the state."
effective_from: 2017-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
