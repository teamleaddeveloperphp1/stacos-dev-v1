code: IN-GST-GSTR5
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-5 — non-resident taxable person return
plain_language_summary: >
  The monthly return for a non-resident who has taken a temporary GST
  registration to make supplies in India. Registration is time-boxed and the tax
  is paid in advance, so this return reconciles what was actually supplied.
statutory_reference: Section 39(5) CGST Act r/w Rule 63
filing_portal_url: "https://www.gst.gov.in"
periodicity: MONTHLY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: NON_RESIDENT
      explain: you are registered as a non-resident taxable person
due:
  anchor: PERIOD_END
  offset: { months: 0, day_of_month: 13 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹50 per day (₹20 nil), capped at ₹5,000."
effective_from: 2017-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
