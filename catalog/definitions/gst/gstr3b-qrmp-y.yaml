  - IN-NL
  - IN-MN
  - IN-MZ
  - IN-TR
  - IN-ML
  - IN-AS
  - IN-WB
  - IN-JH
  - IN-OR
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: REGULAR
      explain: you are registered under the regular scheme
    - fact: qrmp_opted
      op: eq
      value: true
      explain: you have opted for the QRMP scheme
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 24 }
  shift_if_holiday: NONE
