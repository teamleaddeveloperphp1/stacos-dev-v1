code: IN-GST-GSTR3B-QRMP-Y
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-3B — summary return (quarterly, QRMP, 24th)
plain_language_summary: >
  The quarterly summary return for QRMP taxpayers in a category Y state. The same
  return as the 22nd variant, two days later, because the deadline is staggered by
  state.
statutory_reference: Section 39(1) CGST Act r/w Rule 61(1), Notification 29/2021 – Central Tax
filing_portal_url: "https://www.gst.gov.in"
periodicity: QUARTERLY
