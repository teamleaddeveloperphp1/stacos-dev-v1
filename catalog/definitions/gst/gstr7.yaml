code: IN-GST-GSTR7
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-7 — GST TDS return
plain_language_summary: >
  Filed by government departments, PSUs and certain notified bodies that deduct
  GST TDS from their suppliers. The supplier cannot claim the deducted amount
  until this return appears, so it is somebody else's cash flow at stake.
statutory_reference: Section 51 CGST Act r/w Rule 66
filing_portal_url: "https://www.gst.gov.in"
periodicity: MONTHLY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: TDS_DEDUCTOR
      explain: you are registered as a GST TDS deductor
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 10 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: challan, label: TDS payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹100 per day under each Act, capped at ₹5,000, plus 18% interest."
effective_from: 2018-10-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
