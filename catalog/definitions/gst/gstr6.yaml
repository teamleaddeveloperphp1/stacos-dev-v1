code: IN-GST-GSTR6
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-6 — input service distributor return
plain_language_summary: >
  Filed by an office that receives invoices for services used across several
  locations and distributes the credit to them. Late filing strands that credit
  where the receiving branches cannot use it.
statutory_reference: Section 39(4) CGST Act r/w Rule 65
filing_portal_url: "https://www.gst.gov.in"
periodicity: MONTHLY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: ISD
      explain: you are registered as an input service distributor
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 13 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: distribution, label: Credit distribution working, kind: DOC }
default_owner_role: org-finance
penalty_summary: "₹50 per day, capped at ₹5,000."
effective_from: 2017-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
