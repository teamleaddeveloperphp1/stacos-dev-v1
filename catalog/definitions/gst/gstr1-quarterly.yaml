code: IN-GST-GSTR1-QUARTERLY
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-1 — outward supplies (quarterly, QRMP)
plain_language_summary: >
  The quarterly version of the outward-supplies statement, for businesses on the
  Quarterly Return Monthly Payment scheme. Only the return is quarterly — tax is
  still paid every month through PMT-06.
statutory_reference: Section 37 CGST Act, 2017 r/w Rule 59(1)
filing_portal_url: "https://www.gst.gov.in"
periodicity: QUARTERLY
period_anchor: FY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: REGULAR
      explain: you are registered under the regular scheme
    - fact: qrmp_opted
      op: eq
      value: true
      explain: you have opted for the QRMP scheme
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 13 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹50 per day (₹20 for a nil return), capped at ₹2,000 per return."
effective_from: 2021-01-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
