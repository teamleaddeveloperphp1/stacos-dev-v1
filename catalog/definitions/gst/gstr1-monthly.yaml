code: IN-GST-GSTR1-MONTHLY
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-1 — outward supplies (monthly)
plain_language_summary: >
  A statement of every sale you made in the month. It is what populates your
  customers' input tax credit, so filing it late does not only cost you a late
  fee — your customers cannot claim credit until you file, and they will chase
  you for it.
statutory_reference: Section 37 CGST Act, 2017 r/w Rule 59
filing_portal_url: "https://www.gst.gov.in"
periodicity: MONTHLY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: REGULAR
      explain: you are registered under the regular scheme
    - fact: qrmp_opted
      op: ne
      value: true
      explain: you file monthly rather than under QRMP
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 11 }
  # Indian statutory tax dates do not shift for weekends or holidays. The portal
  # accepts filings on a Sunday; relief comes by notification, not by calendar.
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: sales_register, label: Sales register for the period, kind: DOC }
default_owner_role: org-finance
penalty_summary: "₹50 per day (₹20 for a nil return), capped at ₹2,000 per return."
effective_from: 2017-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
