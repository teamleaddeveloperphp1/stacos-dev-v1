code: IN-GST-GSTR9C
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-9C — reconciliation statement
plain_language_summary: >
  A self-certified reconciliation between your audited accounts and the annual
  GST return, required above ₹5 crore of turnover. It is where the differences
  between books and returns have to be explained rather than left for an officer
  to find.
statutory_reference: Section 44(2) CGST Act r/w Rule 80(3)
filing_portal_url: "https://www.gst.gov.in"
periodicity: ANNUAL
period_anchor: FY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: REGULAR
      explain: you are registered under the regular scheme
    - fact: aggregate_turnover
      op: gt
      value: 50000000
      explain: your annual aggregate turnover is above ₹5 crore
due:
  anchor: PERIOD_END
  offset: { months: 9, day_of_month: 31 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed statement acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: audited_accounts, label: Audited financial statements, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "General penalty up to ₹25,000 under Section 125."
effective_from: 2017-07-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
