code: IN-GST-PMT06
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: PMT-06 — monthly tax payment under QRMP
plain_language_summary: >
  QRMP makes the *return* quarterly, not the *payment*. Tax is still deposited in
  the first two months of every quarter through this challan. Missing it attracts
  interest even though no return was due that month, which is the part that
  surprises people.
statutory_reference: Rule 61A CGST Rules r/w Section 39(7) proviso
filing_portal_url: "https://www.gst.gov.in"
periodicity: MONTHLY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: REGULAR
      explain: you are registered under the regular scheme
    - fact: qrmp_opted
      op: eq
      value: true
      explain: you have opted for the QRMP scheme
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 25 }
  shift_if_holiday: NONE
evidence:
  - { key: challan, label: PMT-06 challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "Interest at 18% a year on the shortfall. No separate late fee."
effective_from: 2021-01-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
