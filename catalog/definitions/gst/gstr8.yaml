code: IN-GST-GSTR8
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: GSTR-8 — e-commerce operator TCS return
plain_language_summary: >
  Filed by an e-commerce operator that collects tax at source on supplies made
  through its platform. It reports what was collected from each seller, and it is
  how those sellers get the credit.
statutory_reference: Section 52 CGST Act r/w Rule 67
filing_portal_url: "https://www.gst.gov.in"
periodicity: MONTHLY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: has_ecommerce_sales
      op: eq
      value: true
      explain: you operate an e-commerce platform
    - fact: sector
      op: exists
      value: true
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 10 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed return acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: challan, label: TCS payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹100 per day under each Act, capped at ₹5,000, plus 18% interest."
effective_from: 2018-10-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: MEDIUM
