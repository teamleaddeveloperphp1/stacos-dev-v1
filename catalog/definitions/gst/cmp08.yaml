code: IN-GST-CMP08
country: IN
category: TAX_INDIRECT
family: GST
authority: CBIC
version: 1
title: CMP-08 — composition scheme quarterly statement
plain_language_summary: >
  A short quarterly statement of turnover and tax for businesses under the
  composition scheme. It replaces GSTR-1 and GSTR-3B entirely — a composition
  dealer files this and one annual return, and nothing else.
statutory_reference: Rule 62 CGST Rules r/w Section 10
filing_portal_url: "https://www.gst.gov.in"
periodicity: QUARTERLY
period_anchor: FY
instance_scope: REGISTRATION
scope_selector:
  registration_type: GST
applicability:
  all:
    - fact: registrations
      op: includes
      value: GST
      explain: you hold a GST registration
    - fact: gst_scheme
      op: eq
      value: COMPOSITION
      explain: you are registered under the composition scheme
due:
  anchor: PERIOD_END
  offset: { months: 1, day_of_month: 18 }
  shift_if_holiday: NONE
evidence:
  - { key: ack, label: Filed statement acknowledgement, kind: DOC, mandatory_for_close: true }
  - { key: challan, label: Tax payment challan, kind: DOC, mandatory_for_close: true }
default_owner_role: org-finance
penalty_summary: "₹50 per day (₹20 nil), capped at ₹5,000, plus interest at 18% a year."
effective_from: 2019-04-01
reviewed_by: Skorydov compliance desk
reviewed_at: 2026-06-01
confidence: HIGH
