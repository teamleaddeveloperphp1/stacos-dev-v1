title: GSTR-1A — optional amendment / additional outward-supply details for the same tax period
plain_language_summary: An optional amendment window between GSTR-1 and GSTR-3B for the same period. Using
  it fixes the liability before it is paid; not using it means an amendment in a later period and an interest
  exposure in between.
