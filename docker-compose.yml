# Production and CI parity.
#
# Not required for development on Windows — `scripts/install-dev-stack.ps1`
# installs PostgreSQL and Memurai natively, and `tasks.ps1` runs everything.
# This file exists so that what CI and production run is described somewhere
# other than a deployment tool.
#
# Note the worker topology: one worker per queue class, not one worker for all
# of them. Browser automation and OCR are slow and flaky by nature; reminders are
# latency-sensitive; billing must never be dropped. Sharing a worker pool between
# them means a stuck portal fetch delays somebody's filing reminder.

name: stacos

x-django: &django
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - .:/app
    - media:/app/media

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-stacos.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development mail sink: SMTP on 1025, web interface on 8025.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py sync_system_roles &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    ports: ["8000:8000"]

  # Server-Sent Events need ASGI. One-way push is all this product requires, so
  # there is no websocket layer to run.
  sse:
    <<: *django
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  # ---------------------------------------------------------------------------
  # Workers — one per queue class
  # ---------------------------------------------------------------------------
  worker-default:
    <<: *django
    command: celery -A config worker -l info -Q default --concurrency 4

  worker-reminders:
    <<: *django
    command: celery -A config worker -l info -Q reminders --concurrency 4

  worker-materialise:
    <<: *django
    command: celery -A config worker -l info -Q materialise --concurrency 2

  worker-portal:
    <<: *django
    # Browser automation: isolated, low concurrency, generous time limits.
    command: celery -A config worker -l info -Q portal --concurrency 1

  worker-ocr:
    <<: *django
    command: celery -A config worker -l info -Q ocr --concurrency 2

  worker-returns:
    <<: *django
    command: celery -A config worker -l info -Q returns --concurrency 2

  worker-billing:
    <<: *django
    # Concurrency 1: money-touching work is serialised so idempotency keys never
    # race, even though every task claims one.
    command: celery -A config worker -l info -Q billing --concurrency 1

  worker-exports:
    <<: *django
    command: celery -A config worker -l info -Q exports --concurrency 2

  beat:
    <<: *django
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  flower:
    <<: *django
    command: celery -A config flower --port=5555
    ports: ["5555:5555"]

volumes:
  pgdata:
  redisdata:
  media:
